[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-customer-audiences"
version = "1.1.0"
requires-python = ">=3.12"
description = "Two-time audience history, clock-driven incremental maintenance and correction deltas"
dependencies = []

[tool.setuptools.package-data]
temporal_audiences = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 115
target-version = "py312"
